name: ETF_Momentum 动量轮动信号

on:
  schedule:
    # 每天北京时间 8:00 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch:  # 手动触发

jobs:
  etf-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run ETF rotation script
        run: |
          python ETF_Momentum.py

      - name: Read output
        id: output
        run: |
          echo "signal=$(cat output.txt)" >> $GITHUB_OUTPUT

      - name: Commit history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.json output.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update ETF signal $(date +%Y-%m-%d)"
          git push

      - name: Send to WeChat via Server酱
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          if [ -n "$SERVERCHAN_KEY" ]; then
            curl -s "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
              -d "title=ETF动量轮动信号" \
              -d "desp=$(cat output.txt)"
          fi